name: Push on main 

on:
    push:
      branches:
        - main
      tags-ignore:
        - '**'
jobs:
    call-build-workflow:
        uses: ./.github/workflows/Build.yml
        with:
            version: ${{vars.PRODUCTVERSION}}
            runs-on: windows-latest
        secrets: inherit
    
    call-executetests-workflow:
        needs: call-build-workflow
        uses: ./.github/workflows/executetests.yml
        secrets: inherit
    
    call-publish-workflow:
        needs: call-executetests-workflow
        uses: ./.github/workflows/publish.yml
        with:
            nexus-path: ${{vars.NEXUSARTIFACTREPO}}/latest
        secrets: inherit

    publish-container-test:
        needs: call-executetests-workflow
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publishcontainer.yml
        with:
            tags: |
                type=raw,value=main
                type=sha,format=long,prefix=sha-
