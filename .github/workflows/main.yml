name: Push on main 

on:
    push:
      branches:
        - main
      tags-ignore:
        - '**'
jobs:
    call-build-workflow:
        uses: ./.github/workflows/Build.yml
        with:
            version: ${{vars.PRODUCTVERSION}}
            runs-on: windows-latest
        secrets: inherit
    
    call-executetests-workflow:
        needs: call-build-workflow
        uses: ./.github/workflows/executetests.yml
        secrets: inherit
    
    call-publish-workflow:
        needs: call-executetests-workflow
        uses: ./.github/workflows/publish.yml
        with:
            nexus-path: ${{vars.NEXUSARTIFACTREPO}}/latest
        secrets: inherit

    publish-container-test:
        needs: call-executetests-workflow
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download Linux binary
              uses: actions/download-artifact@v4
              with:
                  name: LemonTree.Pipeline.Tools.ModelCheck.Linux
                  path: docker/context

            - name: Download checks configuration
              uses: actions/download-artifact@v4
              with:
                  name: checks-config
                  path: docker/context

            - name: Set image name
              id: image
              run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push test Docker image
              uses: docker/build-push-action@v6
              with:
                  context: docker/context
                  file: docker/Dockerfile
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:main
                      ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
